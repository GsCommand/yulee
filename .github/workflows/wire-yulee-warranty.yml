name: Wire Yulee warranty page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-yulee-warranty.yml'

permissions:
  contents: write

jobs:
  wire-warranty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire local warranty page across Yulee site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'https://hydrosealpavers.com/warranty'
          new = '/warranty.html'

          for filename in ['apply-home-facelift.js', 'apply-shared-service-layout-v2.js', 'about.html']:
              path = Path(filename)
              text = path.read_text()
              if old not in text and new not in text:
                  raise SystemExit(f'Warranty link anchor not found in {filename}')
              text = text.replace(old, new)
              path.write_text(text)

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          url = 'https://www.yuleepaversealing.com/warranty.html'
          if url not in text:
              block = '''  <url>\n    <loc>https://www.yuleepaversealing.com/warranty.html</loc>\n    <lastmod>2026-09-07</lastmod>\n  </url>\n'''
              if '</urlset>' not in text:
                  raise SystemExit('sitemap closing tag missing')
              text = text.replace('</urlset>', block + '</urlset>')
              sitemap.write_text(text)

          llms = Path('llms.txt')
          text = llms.read_text()
          warranty_line = '- [Paver Sealing Warranty](https://www.yuleepaversealing.com/warranty.html): HydroSeal 2-year workmanship and coating-adhesion warranty terms, exclusions and service steps for Yulee and Nassau County.'
          if warranty_line not in text:
              about_line = '- [About HydroSeal](https://www.yuleepaversealing.com/about.html): HydroSeal company background, process standards, Trident Master Certified approach and Yulee/Nassau County service philosophy.'
              if about_line in text:
                  text = text.replace(about_line, about_line + '\n' + warranty_line)
              else:
                  marker = '## Crawling\n'
                  if marker not in text:
                      raise SystemExit('llms Crawling marker missing')
                  text = text.replace(marker, '## Company\n' + warranty_line + '\n\n' + marker)
              llms.write_text(text)

          print('Wired Yulee warranty page into generated navigation, warranty pills, About page, sitemap and llms.txt')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          test -f warranty.html
          grep -F '<link rel="canonical" href="https://www.yuleepaversealing.com/warranty.html" />' warranty.html >/dev/null
          grep -F '<h1>Paver Sealing Warranty &amp; Promise</h1>' warranty.html >/dev/null
          grep -F 'href="/warranty.html"' apply-home-facelift.js >/dev/null
          grep -F 'href="/warranty.html"' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'href="/warranty.html"' about.html >/dev/null
          grep -F 'https://www.yuleepaversealing.com/warranty.html' sitemap.xml >/dev/null
          grep -F '[Paver Sealing Warranty](https://www.yuleepaversealing.com/warranty.html)' llms.txt >/dev/null

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-home-facelift.js apply-shared-service-layout-v2.js about.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo 'No warranty wiring changes to commit.'
            exit 0
          fi
          git commit -m 'Wire local warranty page across Yulee site'
          git push
