name: Match Yulee nav to HydroSeal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-hydroseal-nav.yml'

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match Yulee homepage navigation to HydroSeal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          script = Path('apply-home-facelift.js')
          text = script.read_text()

          # Make the Paver Sealing dropdown use the same labels/subtext as HydroSeal,
          # while preserving Yulee-local destinations where they exist.
          pattern = re.compile(r'''          <div class="y-home-group">\n            <button class="y-home-parent" type="button" aria-expanded="false">Paver Sealing</button>\n            <div class="y-home-mega">[\s\S]*?            </div>\n          </div>\n          <div class="y-home-group">\n            <button class="y-home-parent" type="button" aria-expanded="false">Service Areas</button>''')
          replacement = '''          <div class="y-home-group y-home-group--paver">\n            <button class="y-home-parent" type="button" aria-expanded="false">Paver Sealing</button>\n            <div class="y-home-mega">\n              <a href="/yulee-driveway-paver-sealing.html">Driveway Paver Sealing<small>Clean, resand, and protect</small></a>\n              <a href="/yulee-pool-deck-paver-sealing.html">Pool Deck Sealing<small>Moisture-aware preparation</small></a>\n              <a href="/yulee-travertine-sealing.html">Travertine Sealing<small>Natural-stone specific care</small></a>\n              <a href="https://hydrosealpavers.com/paver-resealing/">Paver Resealing<small>Restore weathered protection</small></a>\n              <a href="https://hydrosealpavers.com/paver-cleaning">Paver Cleaning<small>Surface-safe preparation and cleaning</small></a>\n              <a href="https://hydrosealpavers.com/paver-repair">Paver Repair<small>Small repairs and paver re-leveling</small></a>\n              <a href="https://hydrosealpavers.com/paver-sealing/sand-options">Joint Sand Options<small>ASTM C144 colors and selection</small></a>\n              <a href="#calculator">Instant Pricing Calculator<small>Estimate standard sealing cost</small></a>\n            </div>\n          </div>\n          <div class="y-home-group">\n            <button class="y-home-parent" type="button" aria-expanded="false">Service Areas</button>'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Paver dropdown replacement count was {n}, expected 1')
          text = text2

          # Desktop visual overrides: match HydroSeal's 12px nav typography and quote-button dimensions.
          replacements = {
              'body.yulee-home .y-home-parent{font-size:10px;letter-spacing:1.15px;padding:11px 8px}':
              'body.yulee-home .y-home-parent{font-size:12px;letter-spacing:1.4px;padding:12px 9px}',
              'body.yulee-home .y-home-call{font-size:10px;padding:11px 14px;background:rgba(255,255,255,.66)}':
              'body.yulee-home .y-home-call{font-size:12px;padding:12px 15px;background:rgba(255,255,255,.66)}',
              'body.yulee-home .y-home-quote{font-size:10px;padding:13px 19px;background:#2fc3ee}':
              'body.yulee-home .y-home-quote{font-size:12px;padding:17px 24px;letter-spacing:1px;background:#2fc3ee}',
              '@media(max-width:1080px){body.yulee-home .y-home-nav{gap:8px}body.yulee-home .y-home-logo img{width:170px}body.yulee-home .y-home-parent{font-size:9px;padding-inline:5px}}':
              '@media(max-width:980px){body.yulee-home .y-home-nav{gap:8px}body.yulee-home .y-home-logo img{width:170px}body.yulee-home .y-home-parent{font-size:11px;padding-inline:5px}}'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected homepage override: {old}')
              text = text.replace(old, new, 1)

          # Make the Paver Sealing menu two columns and the same width as HydroSeal's mega menu.
          marker = 'body.yulee-home .y-home-mega:before{content:\'\';position:absolute;left:0;right:0;top:-14px;height:14px}'
          addition = marker + '\nbody.yulee-home .y-home-group--paver .y-home-mega{width:620px;grid-template-columns:1fr 1fr;gap:7px;padding:18px}'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('Could not find y-home-mega marker for paver menu sizing')
              text = text.replace(marker, addition, 1)

          script.write_text(text)

          css = Path('home-hydroseal.css')
          c = css.read_text()
          c = c.replace('font-size:11px;letter-spacing:1.25px', 'font-size:12px;letter-spacing:1.4px', 1)
          c = c.replace('font-size:11px;white-space:nowrap;background:rgba(255,255,255,.4)', 'font-size:12px;white-space:nowrap;background:rgba(255,255,255,.4)', 1)
          c = c.replace('padding:14px 18px;border-radius:30px;text-transform:uppercase;font-weight:950;letter-spacing:.8px;font-size:11px', 'padding:17px 24px;border-radius:30px;text-transform:uppercase;font-weight:950;letter-spacing:1px;font-size:12px', 1)
          # Do not shrink the desktop nav at 1080px; align the collapse behavior more closely with HydroSeal.
          c = c.replace('@media(max-width:1080px){', '@media(max-width:980px){', 1)
          c = c.replace('font-size:10px;padding-inline:6px', 'font-size:11px;padding-inline:6px', 1)
          css.write_text(c)

          print('Updated Yulee nav typography, quote CTA, and HydroSeal-style Paver Sealing dropdown.')
          PY

      - name: Verify protected SEO elements are untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<h1>Paver Sealing Yulee FL</h1>' apply-home-facelift.js >/dev/null
          grep -F 'const jsonLdBefore' apply-home-facelift.js >/dev/null
          grep -F 'const canonicalBefore' apply-home-facelift.js >/dev/null
          grep -F 'Driveway Paver Sealing<small>Clean, resand, and protect</small>' apply-home-facelift.js >/dev/null
          grep -F 'Instant Pricing Calculator<small>Estimate standard sealing cost</small>' apply-home-facelift.js >/dev/null
          grep -F 'font-size:12px;letter-spacing:1.4px;padding:12px 9px' apply-home-facelift.js >/dev/null
          grep -F 'font-size:12px;padding:17px 24px;letter-spacing:1px' apply-home-facelift.js >/dev/null

      - name: Commit navigation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-home-facelift.js home-hydroseal.css
          if git diff --cached --quiet; then
            echo 'No navigation changes to commit.'
            exit 0
          fi
          git commit -m 'Match Yulee homepage nav to HydroSeal'
          git push
