name: Fix additive FAQ union

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-faq-union.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge pre-existing visible and schema FAQ sets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('expand-faq-library.js')
          text = p.read_text()
          old = '''  if (beforeVisible.items.length && beforeSchema.length) {
    const s = new Set(beforeSchema.map(x => norm(x.q)));
    for (const x of beforeVisible.items) if (!s.has(norm(x.q))) throw new Error(`${filename}: pre-existing visible/schema FAQ mismatch for ${x.q}`);
  }

  let items = beforeVisible.items.length ? beforeVisible.items.map(x => ({...x})) : beforeSchema.map(x => ({...x}));
  const seen = new Set(items.map(x => norm(x.q)));
'''
          new = '''  // Preserve the union of everything already visible and everything already present in FAQ schema.
  // If an older page had drift between the two, repair it additively instead of deleting either side.
  let items = beforeVisible.items.map(x => ({...x}));
  const seen = new Set(items.map(x => norm(x.q)));
  for (const x of beforeSchema) {
    if (!seen.has(norm(x.q))) {
      items.push({...x});
      seen.add(norm(x.q));
    }
  }
'''
          if old not in text:
              raise SystemExit('FAQ union patch marker not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Verify patch
        run: |
          grep -F 'Preserve the union of everything already visible' expand-faq-library.js >/dev/null
          grep -F 'for (const x of beforeSchema)' expand-faq-library.js >/dev/null
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expand-faq-library.js
          git commit -m 'Preserve union of existing visible and schema FAQs'
          git push
