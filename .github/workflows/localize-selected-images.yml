name: Localize selected Yulee images

on:
  push:
    paths:
      - '.github/workflows/localize-selected-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy HydroSeal exterior assets into Yulee
        run: |
          mkdir -p images
          curl -fsSL https://raw.githubusercontent.com/GsCommand/nocatee/main/nocatee-house-wash.webp -o images/hydroseal-house-washing.webp
          curl -fsSL https://raw.githubusercontent.com/GsCommand/nocatee/main/nocatee-roof-washing.webp -o images/hydroseal-roof-washing.webp
          curl -fsSL https://raw.githubusercontent.com/GsCommand/nocatee/main/hydroseal-licensed-insured.png -o images/hydroseal-licensed-insured.png
          curl -fsSL https://raw.githubusercontent.com/GsCommand/nocatee/main/hydroseal-2-year-warranty.png -o images/hydroseal-2-year-warranty.png
          curl -fsSL https://raw.githubusercontent.com/GsCommand/nocatee/main/Trident-Master.jpg -o images/trident-master.jpg

      - name: Point selected ranking pages to self-hosted images only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          SITE = 'https://www.yuleepaversealing.com/images/'
          selected = {
              'index.html': SITE + 'yulee-wildlight-paver-sealing.webp',
              'yulee-driveway-paver-sealing.html': SITE + 'yulee-driveway-paver-sealing.webp',
              'wildlight-paver-sealing.html': SITE + 'yulee-wildlight-paver-sealing.webp',
              'del-webb-wildlight-paver-sealing.html': SITE + 'yulee-wildlight-paver-sealing.webp',
              'fernandina-beach-paver-sealing.html': SITE + 'yulee-driveway-paver-sealing.webp',
              'pressure-washing.html': SITE + 'hydroseal-house-washing.webp',
              'yulee-house-washing.html': SITE + 'hydroseal-house-washing.webp',
              'yulee-roof-washing.html': SITE + 'hydroseal-roof-washing.webp',
          }

          badge_map = {
              'https://nocateepaversealing.com/hydroseal-licensed-insured.png': SITE + 'hydroseal-licensed-insured.png',
              'https://nocateepaversealing.com/hydroseal-2-year-warranty.png': SITE + 'hydroseal-2-year-warranty.png',
              'https://nocateepaversealing.com/Trident-Master.jpg': SITE + 'trident-master.jpg',
          }

          logo_re = re.compile(r'https://cdn\.jsdelivr\.net/gh/GsCommand/yulee@[^/"\']+/yulee-paver-sealing\.webp')
          nocatee_image_re = re.compile(r'https://nocateepaversealing\.com/[^"\'\s)<>]+\.(?:webp|jpg|jpeg|png)', re.I)

          for name, page_image in selected.items():
              p = Path(name)
              s = p.read_text()

              # Local logo. No copy changes.
              s = logo_re.sub(SITE + 'yulee-hydroseal-logo.webp', s)

              # Preserve certification artwork but serve it from Yulee.
              for old, new in badge_map.items():
                  s = s.replace(old, new)

              # Any remaining Nocatee-hosted photo on these selected pages becomes the
              # page-appropriate Yulee/self-hosted project image.
              s = nocatee_image_re.sub(page_image, s)

              p.write_text(s)

              if 'nocateepaversealing.com/' in s:
                  raise SystemExit(f'{name}: Nocatee-hosted image reference remains')
              if 'cdn.jsdelivr.net/gh/GsCommand/yulee@' in s:
                  raise SystemExit(f'{name}: jsDelivr logo reference remains')

          # Keep the existing build-time guard, but stop it from swapping certification
          # sections into different markup. Image localization should not rewrite content.
          p = Path('localize-yulee-images.js')
          s = p.read_text()
          s = re.sub(r"const trustMarkup = `<section[\s\S]*?</section>`;\n\n", '', s, count=1)
          s = re.sub(r"\n\s*// Replace externally hosted certification artwork with factual text credentials\.\n\s*html = html\.replace\(/<section class=\\\"section cert-section\\\">\[\\s\\S\]\*\?<\\/section>/g, trustMarkup\);", '', s, count=1)
          p.write_text(s)
          PY
          git diff --check

      - name: Verify selected sources
        run: |
          for f in index.html yulee-driveway-paver-sealing.html wildlight-paver-sealing.html del-webb-wildlight-paver-sealing.html fernandina-beach-paver-sealing.html pressure-washing.html yulee-house-washing.html yulee-roof-washing.html; do
            if grep -Eq 'nocateepaversealing\.com/.*\.(webp|jpg|jpeg|png)|cdn\.jsdelivr\.net/gh/GsCommand/yulee@' "$f"; then
              echo "External image reference remains in $f"
              exit 1
            fi
          done

      - name: Commit localized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ index.html yulee-driveway-paver-sealing.html wildlight-paver-sealing.html del-webb-wildlight-paver-sealing.html fernandina-beach-paver-sealing.html pressure-washing.html yulee-house-washing.html yulee-roof-washing.html localize-yulee-images.js
          git diff --cached --check
          git commit -m "Localize Yulee image assets without rewriting page content" || exit 0
          git push
