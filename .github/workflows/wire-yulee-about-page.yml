name: Wire Yulee About page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-yulee-about-page.yml'

permissions:
  contents: write

jobs:
  wire-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire local About page into navigation and discovery files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Homepage generated navigation
          home = Path('apply-home-facelift.js')
          text = home.read_text()
          old = '<a href="https://hydrosealpavers.com/about">About HydroSeal</a>'
          new = '<a href="/about.html">About HydroSeal</a>'
          if old not in text and new not in text:
              raise SystemExit('Homepage About navigation anchor not found')
          text = text.replace(old, new)
          home.write_text(text)

          # Shared service/location-page generated navigation
          shared = Path('apply-shared-service-layout-v2.js')
          text = shared.read_text()
          if old not in text and new not in text:
              raise SystemExit('Shared About navigation anchor not found')
          text = text.replace(old, new)
          shared.write_text(text)

          # Sitemap
          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          url = 'https://www.yuleepaversealing.com/about.html'
          if url not in text:
              block = '''  <url>\n    <loc>https://www.yuleepaversealing.com/about.html</loc>\n    <lastmod>2026-09-07</lastmod>\n    <image:image>\n      <image:loc>https://www.yuleepaversealing.com/yulee-sealing-pavers-header.png</image:loc>\n    </image:image>\n  </url>\n'''
              if '</urlset>' not in text:
                  raise SystemExit('sitemap closing tag missing')
              text = text.replace('</urlset>', block + '</urlset>')
              sitemap.write_text(text)

          # llms.txt
          llms = Path('llms.txt')
          text = llms.read_text()
          about_line = '- [About HydroSeal](https://www.yuleepaversealing.com/about.html): HydroSeal company background, process standards, Trident Master Certified approach and Yulee/Nassau County service philosophy.'
          if about_line not in text:
              marker = '## Crawling\n'
              if marker not in text:
                  raise SystemExit('llms Crawling marker missing')
              section = '## Company\n' + about_line + '\n\n'
              text = text.replace(marker, section + marker)
              llms.write_text(text)

          print('Wired Yulee About page into navigation, sitemap and llms.txt')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          test -f about.html
          grep -F '<a href="/about.html">About HydroSeal</a>' apply-home-facelift.js >/dev/null
          grep -F '<a href="/about.html">About HydroSeal</a>' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'https://www.yuleepaversealing.com/about.html' sitemap.xml >/dev/null
          grep -F '[About HydroSeal](https://www.yuleepaversealing.com/about.html)' llms.txt >/dev/null
          grep -F '<link rel="canonical" href="https://www.yuleepaversealing.com/about.html" />' about.html >/dev/null
          grep -F '<h1>About HydroSeal</h1>' about.html >/dev/null

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-home-facelift.js apply-shared-service-layout-v2.js sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo 'No wiring changes to commit.'
            exit 0
          fi
          git commit -m 'Wire local About page across Yulee site'
          git push
