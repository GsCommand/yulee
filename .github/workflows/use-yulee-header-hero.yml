name: Use Yulee header hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-yulee-header-hero.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested hero image exists
        shell: bash
        run: |
          set -euo pipefail
          test -s yulee-sealing-pavers-header.png

      - name: Point homepage facelift at requested hero image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          facelift = Path('apply-home-facelift.js')
          text = facelift.read_text()
          old = 'src="/images/yulee-wildlight-paver-sealing.webp" alt="Resealed paver driveway in Yulee, Florida" fetchpriority="high"'
          new = 'src="/yulee-sealing-pavers-header.png" alt="Resealed paver driveway in Yulee, Florida" fetchpriority="high"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one homepage hero source match, found {count}')
          facelift.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          pkg = package.read_text()
          old_copy = 'favicon.ico *.webp public/'
          new_copy = 'favicon.ico *.webp yulee-sealing-pavers-header.png public/'
          if new_copy not in pkg:
              count = pkg.count(old_copy)
              if count != 1:
                  raise SystemExit(f'Expected one build copy command match, found {count}')
              pkg = pkg.replace(old_copy, new_copy, 1)
              package.write_text(pkg)
          PY

      - name: Verify SEO-protected source files were not changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'apply-home-facelift.js\npackage.json' || test "$changed" = $'package.json\napply-home-facelift.js'
          grep -F 'src="/yulee-sealing-pavers-header.png"' apply-home-facelift.js >/dev/null
          grep -F 'yulee-sealing-pavers-header.png public/' package.json >/dev/null

      - name: Commit requested hero change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-home-facelift.js package.json
          git commit -m 'Use Yulee sealing pavers header as homepage hero'
          git push
