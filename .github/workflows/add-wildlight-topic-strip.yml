name: Add Wildlight topic strip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-wildlight-topic-strip.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add one-line Wildlight topic strip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js_path = Path('apply-shared-service-layout-v2.js')
          js = js_path.read_text()

          anchor = "  const pills = pressurePages.has(filename) ? pressurePills(trustItems) : paverPills();\n"
          insert = anchor + "  const wildlightTopics = filename === 'wildlight-paver-sealing.html' ? `<div class=\"ys-wildlight-topics\" aria-label=\"Wildlight paver conditions\"><span>Wildlight driveways</span><span>Screened lanais</span><span>Pool decks</span><span>Irrigation staining</span><span>Joint-sand washout</span><span>Coastal exposure</span></div>` : '';\n"
          if anchor not in js:
              raise SystemExit('Could not find pill anchor in shared layout script')
          js = js.replace(anchor, insert, 1)

          old = "${pills}${breadcrumb ? breadcrumb[0] : ''}`;"
          new = "${pills}${wildlightTopics}${breadcrumb ? breadcrumb[0] : ''}`;"
          if old not in js:
              raise SystemExit('Could not find newHero pill/breadcrumb anchor')
          js = js.replace(old, new, 1)
          js_path.write_text(js)

          css_path = Path('shared-top-layout.css')
          css = css_path.read_text()
          css_anchor = "body.y-shared-top .ys-feature--compact h3{margin:0}\n"
          css_insert = css_anchor + "\n/* Wildlight six-topic strip: one line across the page. */\nbody.y-shared-top .ys-wildlight-topics{width:min(1180px,calc(100% - 40px));margin:12px auto 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}\nbody.y-shared-top .ys-wildlight-topics span{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px 12px;border:1px solid var(--ys-line);border-radius:999px;background:#fff;color:var(--ys-navy);font-weight:850;font-size:13px;line-height:1.2;text-align:center;white-space:nowrap;box-shadow:0 8px 22px rgba(11,45,74,.06)}\n"
          if css_anchor not in css:
              raise SystemExit('Could not find feature compact CSS anchor')
          css = css.replace(css_anchor, css_insert, 1)

          mobile_anchor = "  body.y-shared-top .ys-feature-strip{grid-template-columns:repeat(2,1fr)}\n"
          mobile_insert = mobile_anchor + "  body.y-shared-top .ys-wildlight-topics{width:calc(100% - 24px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}\n  body.y-shared-top .ys-wildlight-topics span{flex:0 0 auto;min-width:160px}\n"
          if mobile_anchor not in css:
              raise SystemExit('Could not find tablet feature-strip anchor')
          css = css.replace(mobile_anchor, mobile_insert, 1)
          css_path.write_text(css)

          print('Added one-line six-item Wildlight topic strip.')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Wildlight driveways' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'Screened lanais' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'Pool decks' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'Irrigation staining' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'Joint-sand washout' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'Coastal exposure' apply-shared-service-layout-v2.js >/dev/null
          grep -F 'grid-template-columns:repeat(6,minmax(0,1fr))' shared-top-layout.css >/dev/null

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-shared-service-layout-v2.js shared-top-layout.css
          git commit -m 'Add one-line Wildlight topic strip'
          git push
