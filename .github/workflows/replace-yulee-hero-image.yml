name: Replace Yulee hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-yulee-hero-image.yml'

permissions:
  contents: write

jobs:
  replace-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download clean tree-rich HydroSeal hero asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://hydrosealpavers.com/assets/hero/paver-sealing-jacksonville-driveway.webp' \
            -o /tmp/yulee-wildlight-paver-sealing.webp
          test -s /tmp/yulee-wildlight-paver-sealing.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/yulee-wildlight-paver-sealing.webp')
          data = p.read_bytes()
          if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Downloaded asset is not a valid WEBP file')
          print(f'Validated WEBP: {len(data)} bytes')
          PY

      - name: Replace Yulee hero asset at the existing path
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/yulee-wildlight-paver-sealing.webp images/yulee-wildlight-paver-sealing.webp
          git status --short

      - name: Commit hero asset replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/yulee-wildlight-paver-sealing.webp
          if git diff --cached --quiet; then
            echo 'Hero asset already matches; nothing to commit.'
            exit 0
          fi
          git commit -m 'Replace Yulee hero with tree-rich HydroSeal image'
          git push
